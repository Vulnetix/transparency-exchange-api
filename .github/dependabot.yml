# Dependabot version updates. Security updates are enabled in the repository
# settings and run regardless of this file; this file adds the routine version
# bumps. The open undici, ws, sharp and esbuild alerts all come in through
# wrangler (miniflare pins them exactly), so they only clear when wrangler
# itself moves, which a security update for the transitive package cannot do.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Prisma 7 drops the datasource `url` (it moves to prisma.config.ts) and
      # the driverAdapters preview flag that prisma/schema.prisma relies on, so
      # `prisma generate` (run by postinstall) fails. Move to 7 as a migration.
      # The CLI also stays on 6.8.2: from 6.9 its @prisma/config pins
      # deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx, fixed only in 8, which only
      # Prisma 7 pulls in).
      - dependency-name: "prisma"
        versions: [">=6.9.0"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      # The functions run on workerd's Node compatibility layer, not a current
      # Node release, and nothing type-checks them in CI; typing against a
      # newer Node major would let code compile against APIs workerd lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
